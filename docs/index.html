<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H2H League - Cumulative Points vs League Average</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #00ff88;
            font-size: 1.6em;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        #chart {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .standings {
            max-width: 800px;
            margin: 30px auto;
            border-collapse: collapse;
            width: 100%;
        }
        .standings th, .standings td {
            padding: 8px 14px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        .standings th {
            color: #00ff88;
            font-size: 0.85em;
            text-transform: uppercase;
        }
        .standings tr:hover {
            background: #2a2a4e;
        }
        .color-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <h1>H2H League — Cumulative Points vs League Average</h1>
    <div class="subtitle">Season 2025/26 · GW1–GW26 · Each line shows cumulative total minus the 8-manager league average</div>
    <div id="chart"></div>

    <table class="standings" id="standings"></table>

    <script>
        const managers = [
            { name: "Ribeiro (The Participation Me)", id: 8431008, color: "#ff6384",
              pts: [63,51,43,60,61,67,69,67,38,86,47,39,45,67,56,79,80,45,45,35,45,43,43,44,63,56] },
            { name: "Clough (Clough's Crushers)", id: 940183, color: "#36a2eb",
              pts: [35,46,71,62,33,55,88,72,37,69,29,47,32,91,45,80,97,46,51,53,58,31,33,56,69,48] },
            { name: "MacLeod (Fellaini's 11½)", id: 785223, color: "#ffce56",
              pts: [59,44,58,61,42,61,56,52,75,57,54,23,43,55,50,94,86,47,37,36,35,41,29,79,70,69] },
            { name: "Reed (Nothing Else Matheus)", id: 6274965, color: "#4bc0c0",
              pts: [55,51,57,66,39,21,80,53,57,60,27,34,42,73,51,62,102,71,30,61,62,50,37,71,53,58] },
            { name: "Claude-ai (Generational Talents)", id: 6853564, color: "#00ff88",
              pts: [57,40,19,43,42,62,70,75,49,87,40,83,35,83,78,67,36,40,31,35,64,38,21,67,66,46] },
            { name: "Farrington (The Full English)", id: 6309303, color: "#ff9f40",
              pts: [40,32,32,54,41,35,63,37,55,57,62,67,33,75,53,65,65,52,46,42,48,30,50,32,40,82] },
            { name: "Fernandes (Artekkers)", id: 3466784, color: "#c792ea",
              pts: [55,65,66,56,36,50,67,75,33,56,44,34,34,84,49,79,87,62,46,28,50,31,39,50,73,85] },
            { name: "Asmat (Botman Begins)", id: 3300973, color: "#f78c6c",
              pts: [56,31,55,57,53,65,74,60,34,65,33,44,52,42,63,64,49,45,29,29,74,43,47,59,56,61] }
        ];

        const numGW = managers[0].pts.length;
        const gws = Array.from({length: numGW}, (_, i) => i + 1);

        // Compute league average per GW (cumulative)
        const leagueAvgCumulative = [];
        for (let gw = 0; gw < numGW; gw++) {
            let totalCum = 0;
            for (const m of managers) {
                let cum = 0;
                for (let j = 0; j <= gw; j++) cum += m.pts[j];
                totalCum += cum;
            }
            leagueAvgCumulative.push(totalCum / managers.length);
        }

        // Build traces
        const traces = managers.map(m => {
            const cumulative = [];
            let sum = 0;
            for (let i = 0; i < numGW; i++) {
                sum += m.pts[i];
                cumulative.push(sum);
            }
            const relativeToAvg = cumulative.map((c, i) => c - leagueAvgCumulative[i]);

            return {
                x: gws,
                y: relativeToAvg,
                mode: 'lines+markers',
                name: m.name,
                line: { color: m.color, width: 2.5 },
                marker: { size: 5 },
                hovertemplate: '<b>%{fullData.name}</b><br>GW%{x}<br>vs avg: %{y:+.0f} pts<extra></extra>'
            };
        });

        // Zero line
        traces.push({
            x: gws,
            y: Array(numGW).fill(0),
            mode: 'lines',
            name: 'League Average',
            line: { color: '#555', width: 1, dash: 'dash' },
            hoverinfo: 'skip',
            showlegend: true
        });

        const layout = {
            paper_bgcolor: '#1a1a2e',
            plot_bgcolor: '#1a1a2e',
            font: { color: '#e0e0e0', family: '-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif' },
            xaxis: {
                title: 'Gameweek',
                gridcolor: '#2a2a4e',
                dtick: 1,
                range: [0.5, numGW + 0.5]
            },
            yaxis: {
                title: 'Points vs League Average',
                gridcolor: '#2a2a4e',
                zeroline: true,
                zerolinecolor: '#555',
                zerolinewidth: 1
            },
            legend: {
                orientation: 'h',
                y: -0.15,
                x: 0.5,
                xanchor: 'center',
                font: { size: 11 }
            },
            margin: { t: 20, b: 100, l: 60, r: 20 },
            hovermode: 'x unified'
        };

        Plotly.newPlot('chart', traces, layout, {
            responsive: true,
            displayModeBar: false
        });

        // Build standings table
        const standingsData = managers.map(m => {
            const total = m.pts.reduce((a, b) => a + b, 0);
            return { ...m, total };
        }).sort((a, b) => b.total - a.total);

        let tableHTML = `
            <tr><th></th><th>Manager</th><th>Total Pts</th><th>vs Avg</th><th>Best GW</th><th>Worst GW</th></tr>
        `;
        const overallAvg = standingsData.reduce((s, m) => s + m.total, 0) / standingsData.length;

        for (const m of standingsData) {
            const diff = m.total - overallAvg;
            const best = Math.max(...m.pts);
            const worst = Math.min(...m.pts);
            const bestGW = m.pts.indexOf(best) + 1;
            const worstGW = m.pts.indexOf(worst) + 1;
            tableHTML += `<tr>
                <td><span class="color-dot" style="background:${m.color}"></span></td>
                <td>${m.name}</td>
                <td>${m.total}</td>
                <td style="color:${diff >= 0 ? '#00ff88' : '#ff6384'}">${diff >= 0 ? '+' : ''}${diff.toFixed(0)}</td>
                <td>${best} (GW${bestGW})</td>
                <td>${worst} (GW${worstGW})</td>
            </tr>`;
        }
        document.getElementById('standings').innerHTML = tableHTML;
    </script>
</body>
</html>
