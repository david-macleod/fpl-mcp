<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H2H League - Cumulative H2H Points vs League Average</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #00ff88;
            font-size: 1.6em;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        #chart {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .standings {
            max-width: 900px;
            margin: 30px auto;
            border-collapse: collapse;
            width: 100%;
        }
        .standings th, .standings td {
            padding: 8px 14px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        .standings th {
            color: #00ff88;
            font-size: 0.85em;
            text-transform: uppercase;
        }
        .standings tr:hover {
            background: #2a2a4e;
        }
        .color-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <h1>H2H League — Cumulative H2H Points vs League Average</h1>
    <div class="subtitle">Season 2025/26 · GW1–GW25 · 3 pts for a win, 0 for a loss · Each line shows cumulative H2H points minus the league average</div>
    <div id="chart"></div>

    <table class="standings" id="standings"></table>

    <script>
        // H2H points per gameweek (3 for win, 0 for loss) derived from match results
        const managers = [
            { name: "Ribeiro (The Participation Me)", color: "#ff6384",
              h2h: [3,3,3,3,3,3,3,3,0,3,3,0,3,0,3,0,3,3,3,0,0,0,3,3,0] },
            { name: "Clough (Clough's Crushers)", color: "#36a2eb",
              h2h: [0,3,3,3,0,0,3,3,0,3,0,3,0,3,0,3,3,0,3,3,0,3,3,3,0] },
            { name: "MacLeod (Fellaini's 11½)", color: "#ffce56",
              h2h: [3,0,3,0,3,3,0,0,3,0,3,0,3,3,3,3,3,0,0,0,0,3,0,3,3] },
            { name: "Reed (Nothing Else Matheus)", color: "#4bc0c0",
              h2h: [0,3,0,3,0,0,0,0,3,3,0,0,3,0,0,0,3,3,0,3,3,3,0,3,0] },
            { name: "Claude-ai (Generational Talents)", color: "#00ff88",
              h2h: [3,0,0,0,3,3,3,3,3,3,0,3,0,3,3,0,0,0,0,0,3,0,0,0,3] },
            { name: "Farrington (The Full English)", color: "#ff9f40",
              h2h: [3,0,0,3,3,0,0,0,3,0,3,3,0,0,3,0,0,3,3,3,0,0,3,0,0] },
            { name: "Fernandes (Artekkers)", color: "#c792ea",
              h2h: [0,3,3,0,0,0,0,3,0,0,3,0,0,3,0,3,0,3,3,0,3,0,0,0,3] },
            { name: "Asmat (Botman Begins)", color: "#f78c6c",
              h2h: [0,0,0,0,0,3,3,0,0,0,0,3,3,0,0,3,0,0,0,3,3,3,3,0,3] }
        ];

        const numGW = managers[0].h2h.length;
        const gws = Array.from({length: numGW}, (_, i) => i + 1);

        // Compute league average cumulative H2H points per GW
        // In each GW, 4 matches = 4 winners getting 3 pts each = 12 pts / 8 managers = 1.5 avg per GW
        const leagueAvgCumulative = gws.map(gw => gw * 1.5);

        // Build traces
        const traces = managers.map(m => {
            const cumulative = [];
            let sum = 0;
            for (let i = 0; i < numGW; i++) {
                sum += m.h2h[i];
                cumulative.push(sum);
            }
            const relativeToAvg = cumulative.map((c, i) => c - leagueAvgCumulative[i]);

            return {
                x: gws,
                y: relativeToAvg,
                mode: 'lines+markers',
                name: m.name,
                line: { color: m.color, width: 2.5 },
                marker: { size: 5 },
                hovertemplate: '<b>%{fullData.name}</b><br>GW%{x}<br>H2H pts: ' +
                    cumulative.map(c => c).join(',').split(',').map((_, i) => cumulative[i]).join('SPLIT')[0] +
                    '<br>vs avg: %{y:+.0f}<extra></extra>',
                customdata: cumulative.map((c, i) => [c, m.h2h[i] === 3 ? 'W' : (m.h2h[i] === 1 ? 'D' : 'L')])
            };
        });

        // Fix hovertemplate to use customdata
        traces.forEach(t => {
            t.hovertemplate = '<b>%{fullData.name}</b><br>GW%{x}: %{customdata[1]}<br>Cumulative: %{customdata[0]} pts<br>vs avg: %{y:+.0f}<extra></extra>';
        });

        // Zero line
        traces.push({
            x: gws,
            y: Array(numGW).fill(0),
            mode: 'lines',
            name: 'League Average (1.5 pts/GW)',
            line: { color: '#555', width: 1, dash: 'dash' },
            hoverinfo: 'skip',
            showlegend: true
        });

        const layout = {
            paper_bgcolor: '#1a1a2e',
            plot_bgcolor: '#1a1a2e',
            font: { color: '#e0e0e0', family: '-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif' },
            xaxis: {
                title: 'Gameweek',
                gridcolor: '#2a2a4e',
                dtick: 1,
                range: [0.5, numGW + 0.5]
            },
            yaxis: {
                title: 'H2H Points vs League Average',
                gridcolor: '#2a2a4e',
                zeroline: true,
                zerolinecolor: '#555',
                zerolinewidth: 1
            },
            legend: {
                orientation: 'h',
                y: -0.15,
                x: 0.5,
                xanchor: 'center',
                font: { size: 11 }
            },
            margin: { t: 20, b: 100, l: 60, r: 20 },
            hovermode: 'x unified'
        };

        Plotly.newPlot('chart', traces, layout, {
            responsive: true,
            displayModeBar: false
        });

        // Build standings table
        const standingsData = managers.map(m => {
            const total = m.h2h.reduce((a, b) => a + b, 0);
            const wins = m.h2h.filter(x => x === 3).length;
            const losses = m.h2h.filter(x => x === 0).length;
            // Longest win streak
            let maxStreak = 0, streak = 0;
            for (const r of m.h2h) {
                if (r === 3) { streak++; maxStreak = Math.max(maxStreak, streak); }
                else streak = 0;
            }
            // Longest losing streak
            let maxLStreak = 0, lstreak = 0;
            for (const r of m.h2h) {
                if (r === 0) { lstreak++; maxLStreak = Math.max(maxLStreak, lstreak); }
                else lstreak = 0;
            }
            // Current form (last 5)
            const form = m.h2h.slice(-5).map(x => x === 3 ? 'W' : 'L').join('');
            return { ...m, total, wins, losses, maxStreak, maxLStreak, form };
        }).sort((a, b) => b.total - a.total);

        let tableHTML = `
            <tr><th></th><th>Manager</th><th>H2H Pts</th><th>W-L</th><th>vs Avg</th><th>Best Streak</th><th>Worst Streak</th><th>Last 5</th></tr>
        `;
        const overallAvg = 25 * 1.5; // 37.5

        for (const m of standingsData) {
            const diff = m.total - overallAvg;
            tableHTML += `<tr>
                <td><span class="color-dot" style="background:${m.color}"></span></td>
                <td>${m.name}</td>
                <td>${m.total}</td>
                <td>${m.wins}W-${m.losses}L</td>
                <td style="color:${diff >= 0 ? '#00ff88' : '#ff6384'}">${diff >= 0 ? '+' : ''}${diff.toFixed(1)}</td>
                <td style="color:#00ff88">${m.maxStreak}W</td>
                <td style="color:#ff6384">${m.maxLStreak}L</td>
                <td style="font-family:monospace;letter-spacing:2px">${m.form.split('').map(c => c === 'W' ? '<span style="color:#00ff88">W</span>' : '<span style="color:#ff6384">L</span>').join('')}</td>
            </tr>`;
        }
        document.getElementById('standings').innerHTML = tableHTML;
    </script>
</body>
</html>
