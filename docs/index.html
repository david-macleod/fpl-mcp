<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H2H League - Cumulative H2H Points vs League Average</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #00ff88;
            font-size: 1.6em;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        #chart {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .standings {
            max-width: 900px;
            margin: 30px auto;
            border-collapse: collapse;
            width: 100%;
        }
        .standings th, .standings td {
            padding: 8px 14px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        .standings th {
            color: #00ff88;
            font-size: 0.85em;
            text-transform: uppercase;
        }
        .standings tr:hover {
            background: #2a2a4e;
        }
        .color-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }
        nav { text-align: center; margin-bottom: 20px; }
        nav a { color: #00ff88; margin: 0 12px; text-decoration: none; font-size: 0.95em; }
        nav a:hover { text-decoration: underline; }
        nav a.active { border-bottom: 2px solid #00ff88; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="active">H2H Points</a>
        <a href="bench.html">Bench Points</a>
        <a href="hits.html">Transfer Hits</a>
    </nav>
    <h1>H2H League — Cumulative H2H Points vs League Average</h1>
    <div class="subtitle">Season 2025/26 · GW1–GW38 (Final) · 3 pts for a win, 1 for a draw · Each line shows cumulative H2H points minus the league average</div>
    <div id="chart"></div>

    <table class="standings" id="standings"></table>

    <script>
        // H2H points per gameweek (3=win, 1=draw, 0=loss) — full season GW1-38
        const managers = [
            { name: "Ribeiro (The Participation Me)", color: "#ff6384",
              h2h: [3,3,3,3,3,3,3,3,0,3,3,0,3,0,3,0,3,3,3,0,0,0,3,3,0,0,0,0,0,1,3,3,3,3,0,0,0,3] },
            { name: "Clough (Clough's Crushers)", color: "#36a2eb",
              h2h: [0,3,3,3,0,0,3,3,0,3,0,3,0,3,0,3,3,0,3,3,0,3,3,3,0,0,3,3,3,3,3,3,3,0,0,3,0,3] },
            { name: "MacLeod (Fellaini's 11½)", color: "#ffce56",
              h2h: [3,0,3,0,3,3,0,0,3,0,3,0,3,3,3,3,3,0,0,0,0,3,0,3,3,3,0,0,0,1,3,3,0,3,3,0,0,0] },
            { name: "Reed (Nothing Else Matheus)", color: "#4bc0c0",
              h2h: [0,3,0,3,0,0,0,0,3,3,0,0,3,0,0,0,3,3,0,3,3,3,0,3,0,0,0,0,3,3,0,0,3,1,3,3,3,0] },
            { name: "Claude-ai (Generational Talents)", color: "#00ff88",
              h2h: [3,0,0,0,3,3,3,3,3,3,0,3,0,3,3,0,0,0,0,0,3,0,0,0,3,0,3,3,0,0,0,0,0,1,0,0,3,0] },
            { name: "Farrington (The Full English)", color: "#ff9f40",
              h2h: [3,0,0,3,3,0,0,0,3,0,3,3,0,0,3,0,0,3,3,3,0,0,3,0,0,3,3,0,0,0,0,3,0,0,3,3,0,3] },
            { name: "Fernandes (Artekkers)", color: "#c792ea",
              h2h: [0,3,3,0,0,0,0,3,0,0,3,0,0,3,0,3,0,3,3,0,3,0,0,0,3,3,3,3,3,3,0,0,3,3,3,0,3,0] },
            { name: "Asmat (Botman Begins)", color: "#f78c6c",
              h2h: [0,0,0,0,0,3,3,0,0,0,0,3,3,0,0,3,0,0,0,3,3,3,3,0,3,3,0,3,3,0,0,0,0,0,0,3,3,3] }
        ];

        const numGW = managers[0].h2h.length;
        const gws = Array.from({length: numGW}, (_, i) => i + 1);

        // Compute actual league average per GW (accounts for draws)
        const gwTotals = gws.map((_, i) => managers.reduce((s, m) => s + m.h2h[i], 0));
        const leagueAvgCumulative = [];
        let avgSum = 0;
        for (let i = 0; i < numGW; i++) {
            avgSum += gwTotals[i] / managers.length;
            leagueAvgCumulative.push(avgSum);
        }

        // Build traces
        const traces = managers.map(m => {
            const cumulative = [];
            let sum = 0;
            for (let i = 0; i < numGW; i++) {
                sum += m.h2h[i];
                cumulative.push(sum);
            }
            const relativeToAvg = cumulative.map((c, i) => c - leagueAvgCumulative[i]);

            return {
                x: gws,
                y: relativeToAvg,
                mode: 'lines+markers',
                name: m.name,
                line: { color: m.color, width: 2.5 },
                marker: { size: 4 },
                customdata: cumulative.map((c, i) => [c, m.h2h[i] === 3 ? 'W' : (m.h2h[i] === 1 ? 'D' : 'L')]),
                hovertemplate: '<b>%{fullData.name}</b><br>GW%{x}: %{customdata[1]}<br>Cumulative: %{customdata[0]} pts<br>vs avg: %{y:+.1f}<extra></extra>'
            };
        });

        // Zero line
        traces.push({
            x: gws,
            y: Array(numGW).fill(0),
            mode: 'lines',
            name: 'League Average',
            line: { color: '#555', width: 1, dash: 'dash' },
            hoverinfo: 'skip',
            showlegend: true
        });

        const layout = {
            paper_bgcolor: '#1a1a2e',
            plot_bgcolor: '#1a1a2e',
            font: { color: '#e0e0e0', family: '-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif' },
            xaxis: {
                title: 'Gameweek',
                gridcolor: '#2a2a4e',
                dtick: 1,
                range: [0.5, numGW + 0.5]
            },
            yaxis: {
                title: 'H2H Points vs League Average',
                gridcolor: '#2a2a4e',
                dtick: 3,
                zeroline: true,
                zerolinecolor: '#555',
                zerolinewidth: 1
            },
            legend: {
                orientation: 'h',
                y: -0.15,
                x: 0.5,
                xanchor: 'center',
                font: { size: 11 }
            },
            margin: { t: 20, b: 100, l: 60, r: 20 },
            hovermode: 'x unified'
        };

        Plotly.newPlot('chart', traces, layout, {
            responsive: true,
            displayModeBar: false
        });

        // Build standings table
        const standingsData = managers.map(m => {
            const total = m.h2h.reduce((a, b) => a + b, 0);
            const wins = m.h2h.filter(x => x === 3).length;
            const draws = m.h2h.filter(x => x === 1).length;
            const losses = m.h2h.filter(x => x === 0).length;
            let maxStreak = 0, streak = 0;
            for (const r of m.h2h) {
                if (r === 3) { streak++; maxStreak = Math.max(maxStreak, streak); }
                else streak = 0;
            }
            let maxLStreak = 0, lstreak = 0;
            for (const r of m.h2h) {
                if (r === 0) { lstreak++; maxLStreak = Math.max(maxLStreak, lstreak); }
                else lstreak = 0;
            }
            const form = m.h2h.slice(-5).map(x => x === 3 ? 'W' : (x === 1 ? 'D' : 'L')).join('');
            return { ...m, total, wins, draws, losses, maxStreak, maxLStreak, form };
        }).sort((a, b) => b.total - a.total);

        const overallAvg = leagueAvgCumulative[numGW - 1];

        let tableHTML = `
            <tr><th></th><th>Manager</th><th>H2H Pts</th><th>W-D-L</th><th>vs Avg</th><th>Best Streak</th><th>Worst Streak</th><th>Last 5</th></tr>
        `;

        for (const m of standingsData) {
            const diff = m.total - overallAvg;
            const formHTML = m.form.split('').map(c => {
                if (c === 'W') return '<span style="color:#00ff88">W</span>';
                if (c === 'D') return '<span style="color:#ffce56">D</span>';
                return '<span style="color:#ff6384">L</span>';
            }).join('');
            tableHTML += `<tr>
                <td><span class="color-dot" style="background:${m.color}"></span></td>
                <td>${m.name}</td>
                <td>${m.total}</td>
                <td>${m.wins}W-${m.draws}D-${m.losses}L</td>
                <td style="color:${diff >= 0 ? '#00ff88' : '#ff6384'}">${diff >= 0 ? '+' : ''}${diff.toFixed(1)}</td>
                <td style="color:#00ff88">${m.maxStreak}W</td>
                <td style="color:#ff6384">${m.maxLStreak}L</td>
                <td style="font-family:monospace;letter-spacing:2px">${formHTML}</td>
            </tr>`;
        }
        document.getElementById('standings').innerHTML = tableHTML;
    </script>
</body>
</html>
